# TeleTriage runtime configuration
# Thresholds here are STARTING POINTS - calibrate them on a held-out validation set
# (see evaluation/ when Phase 4 is built)

app:
  name: teletriage
  version: "0.2.0"

# Paths (relative to project root)
paths:
  cache_file: database/sample_cache.json
  knowledge_base: database/real_kb.jsonl   # ACTIVE — what gets indexed (6,913 chunks)
  faiss_index_dir: database/indexes/
  log_dir: outputs/

# ─── Tier 1: Cache-Augmented Generation (CAG) ─────────────────────────
# The fast path. O(1) exact lookup, then fuzzy match as safety net.
cache_tier:
  enabled: true
  # Fuzzy matching only kicks in if exact/normalized match fails.
  # rapidfuzz returns scores 0-100. 85 = very similar phrasing,
  # 90 = near-identical. Start strict; loosen after you measure.
  fuzzy_threshold: 90
  # Only return a cache hit if confidence >= this. Below = delegate.
  min_confidence: 0.85

# ─── Tier 2: Retrieval-Augmented Generation (RAG) ─────────────────────
# Hybrid retrieval: BM25 (sparse) + dense (embeddings) fused with RRF,
# then re-ranked with a cross-encoder.
retrieval_tier:
  enabled: true
  # Embedding model - BGE-small is the sweet spot for CPU inference.
  # Alternatives: BAAI/bge-base-en-v1.5 (better, 2x slower)
  embedder_model: BAAI/bge-small-en-v1.5
  # Cross-encoder for reranking - adds latency but huge precision gain
  reranker_model: BAAI/bge-reranker-base
  # How many candidates to retrieve from each retriever before fusion
  bm25_top_k: 20
  dense_top_k: 20
  # After RRF, how many to send to the reranker (more = slower but better)
  rerank_top_k: 10
  # RRF constant - 60 is the standard value from the original RRF paper
  rrf_k: 60
  # Reranker score is a logit; > 0 typically means "relevant".
  # Calibrate on your val set. Starting point: accept if score >= 0.5.
  min_rerank_score: 0.20
  min_confidence: 0.50
  # Fallback chain order for tier 2's RAG synthesis call, tried
  # left-to-right. Groq primary. Same provider order as
  # generative_tier.backend_order below, but a DIFFERENT Groq key
  # (secrets.groq_api_key vs .groq_api_key_tier3) so the two tiers draw
  # from independent 12,000 TPM pools instead of sharing one.
  backend_order: [groq, gemini, local]
  # How many top reranked chunks feed the RAG synthesis call (see
  # backend/tiers/retrieval_tier.py). More = better grounding, more
  # tokens/cost/latency. 5 is a reasonable default for ~2000-char chunks.
  synthesis_top_k: 5
  # Same model as generative_tier.groq_model (70B), not a smaller one —
  # a cheaper model's free-tier TPM budget throttled too often to be
  # reliable at this traffic pattern.
  synthesis_model: llama-3.3-70b-versatile
  # Per-chunk char cap for synthesis context. null = no truncation
  # (chunks are already ~2048 chars from scraping). Trades context size
  # for synthesis latency; measure before changing from null.
  synthesis_chunk_chars: null

# ─── Tier 3: Generative Fallback ──────────────────────────────────────
generative_tier:
  enabled: true
  # Fallback chain order for tier 3, tried left-to-right. Groq primary,
  # via its OWN key (secrets.groq_api_key_tier3, see
  # GenerativeTier.__init__) — an independent 12,000 TPM pool from tier
  # 2's. Gemini and local are fallback-of-last-resort only, never
  # primary: Gemini's free tier is request-count limited (5/min, 20/day
  # observed) and throttles fast under real primary traffic.
  backend_order: [groq, gemini, local]
  # Model names per backend
  groq_model: llama-3.3-70b-versatile
  # A Google-managed alias, not a pinned version — pinned Gemini model
  # names on this account have gone stale (404) more than once. See
  # backend/generation/llm_client.py's GeminiClient docstring.
  gemini_model: gemini-flash-latest
  local_model: Qwen/Qwen2.5-1.5B-Instruct
  # Generation params
  max_tokens: 512
  temperature: 0.2   # low - we want deterministic troubleshooting advice
  # System prompt defined in code (generative_tier.py) so we can version it

# ─── Observability ────────────────────────────────────────────────────
observability:
  log_level: INFO
  # Every query + which tier answered + latency + confidence
  metrics_file: outputs/query_metrics.jsonl
