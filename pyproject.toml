[project]
name = "teletriage"
version = "0.2.0"
description = "Hierarchical multi-tier telecom fault-resolution engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arya Doshi" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # Retrieval & embeddings
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",          # fast fuzzy string match for CAG
    "numpy>=1.26",
    # Generation (all free tiers)
    "groq>=0.11",              # Llama 3.3 70B free
    "google-genai>=1.74.0",    # Gemini 2.0 Flash (replaces deprecated google-generativeai)
    "transformers>=4.44",      # local fallback
    "torch>=2.3",
    "accelerate>=0.33",
    # Eval
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    # Observability
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[project.scripts]
teletriage = "teletriage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teletriage"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: loads ML models (BGE-small, bge-reranker-base) — skip with -m 'not slow'",
    "integration: requires external resources (pre-built indexes or live API keys)",
]
